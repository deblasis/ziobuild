name: CI

on:
  push:
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: mlugg/setup-zig@v2
        with:
          version: "0.16.0"
      - name: zig fmt
        run: zig fmt --check src tests examples build.zig
      - name: zig build test
        run: zig build test --summary all
      - name: build minimal fixture
        working-directory: examples/minimal
        run: zig build
      - name: build conditional_patching example
        working-directory: examples/conditional_patching
        run: zig build
